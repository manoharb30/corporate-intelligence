services:
  neo4j:
    image: neo4j:5-community
    container_name: lookinsight-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      # Memory: heap fits queries comfortably; pagecache holds whole DB many times over
      # Tuned for 4 GB VPS: 2G heap handles bulk imports, pagecache fits whole DB many times
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "512m"
      # APOC permissions
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - /srv/lookinsight/neo4j/data:/data
      - /srv/lookinsight/neo4j/logs:/logs
      - /srv/lookinsight/neo4j/plugins:/plugins
      - /srv/lookinsight/backups:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ..
      dockerfile: compose/Dockerfile.backend
    container_name: lookinsight-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Override Aura connection — backend talks to local Neo4j over internal docker network
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      # NEO4J_PASSWORD inherited from .env
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [internal]
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: lookinsight-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/lookinsight/caddy/data:/data
      - /srv/lookinsight/caddy/config:/config
    depends_on:
      - backend
    networks: [internal]

networks:
  internal:
    driver: bridge
